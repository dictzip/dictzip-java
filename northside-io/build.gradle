plugins {
    id 'java-library'
}

version = rootProject.version

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

dependencies {
    implementation(libs.commons.io)
    implementation(libs.jspecify)
    testImplementation(libs.junit.jupiter)
}

test {
    useJUnitPlatform()
}

